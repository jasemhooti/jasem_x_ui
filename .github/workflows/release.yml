name: Release jasem_x_ui

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  XRAY_VERSION: v26.6.27
  SINGBOX_VERSION: 1.14.2

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform hitting a transient outage must not cancel the other.
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build: //go:embed all:dist in
      # internal/web/web.go needs internal/web/dist/ (gitignored) at compile time.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build jasem_x_ui
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64"; XRAY_ZIP="Xray-linux-64.zip"; TUIC_TARGET="x86_64-unknown-linux-musl" ;;
            arm64) BOOTLIN_ARCH="aarch64"; XRAY_ZIP="Xray-linux-arm64-v8a.zip"; TUIC_TARGET="aarch64-unknown-linux-musl" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS $CURL_RETRY -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir jasem_x_ui
          mv xui-release jasem_x_ui/x-ui
          cp x-ui.service.debian x-ui.service.arch x-ui.service.rhel x-ui.rc jasem_x_ui/
          cp x-ui.sh install.sh update.sh jasem_x_ui/
          mkdir jasem_x_ui/bin
          cd jasem_x_ui/bin

          # Xray-core, pinned
          fetch "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ZIP}"
          unzip "${XRAY_ZIP}"
          rm -f "${XRAY_ZIP}" geoip.dat geosite.dat
          mv xray xray-linux-${{ matrix.platform }}

          # sing-box sidecar, pinned (tarball nests the binary in a folder)
          SB_PKG="sing-box-${SINGBOX_VERSION}-linux-${{ matrix.platform }}"
          curl -sfLRO $CURL_RETRY "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${SB_PKG}.tar.gz"
          tar -xzf "${SB_PKG}.tar.gz"
          mv "${SB_PKG}/sing-box" "sing-box-linux-${{ matrix.platform }}"
          rm -rf "${SB_PKG}" "${SB_PKG}.tar.gz"
          chmod +x "sing-box-linux-${{ matrix.platform }}"

          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat

          # mtg-multi (MTProto sidecar); the tag comes from the release-page
          # redirect because api.github.com has 503'd whole release runs.
          MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
          if [ -z "$MTG_MULTI_VER" ]; then echo "could not resolve the latest mtg-multi release tag"; exit 1; fi
          MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
          curl -sfLRO $CURL_RETRY "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
          tar -xzf "${MTG_PKG}.tar.gz"
          mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
          rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"

          curl -sfLRo tuic-server $CURL_RETRY "https://github.com/EAimTY/tuic/releases/download/tuic-server-1.0.0/tuic-server-1.0.0-${TUIC_TARGET}"
          chmod +x tuic-server
          cd ..

          # acme.sh is bundled so servers without GitHub/get.acme.sh access can
          # still issue certificates; install.sh runs "./acme.sh --install" from it.
          mkdir acme-bundle
          curl -sfL $CURL_RETRY "https://github.com/acmesh-official/acme.sh/archive/refs/heads/master.tar.gz" | tar -xz --strip-components=1 -C acme-bundle
          test -f acme-bundle/acme.sh
          cd ..

      - name: Package
        run: |
          tar -zcvf jasem_x_ui-linux-${{ matrix.platform }}.tar.gz jasem_x_ui
          sha256sum jasem_x_ui-linux-${{ matrix.platform }}.tar.gz > jasem_x_ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jasem_x_ui-linux-${{ matrix.platform }}
          path: |
            ./jasem_x_ui-linux-${{ matrix.platform }}.tar.gz
            ./jasem_x_ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: jasem_x_ui-linux-${{ matrix.platform }}.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: true

  # Publishes the plain installer scripts next to the archives (for --mirror).
  publish-scripts:
    name: Publish install scripts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Upload scripts to GH release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: "{install.sh,update.sh}"
          file_glob: true
          overwrite: true
          prerelease: true

  # Rolling dev channel: overwrites a single fixed-tag pre-release `dev-latest`,
  # force-moved to the newest main commit. `--latest=false` keeps releases/latest
  # pointing at the real stable tag.
  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 install.sh update.sh --clobber
